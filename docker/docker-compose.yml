services:
  app:
    image: ${APP_IMAGE:-app-template:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../server/.env
        required: false
    environment:
      APP_ENV: production
      HTTP_ADDR: 127.0.0.1:8080
    ports:
      - "${APP_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_signal: SIGTERM
    stop_grace_period: 15s
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
